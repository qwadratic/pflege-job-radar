<!doctype html>
<!-- Sign-in page, served at /login by app/main.py. Built by web/build.py from web/login.template.html.
     One shared owner passphrase (docs/auth.md): POST /api/auth/login sets the session cookie, then the
     browser goes to ?next= (or /pro). The tokens and the two font links are copied from
     web/index.template.html on purpose -- two pages do not justify a shared stylesheet. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Anmelden — Pflege-Stellen Bayern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--surface:#F4F7F8;--ink:#23201E;--ink-2:#5B5855;--ink-3:#8C8985;--accent:#202D85;--sky:#C8F1FF;--neon:#9DE146;--red:#D82434;--line:#E1E6E9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px} a:hover{background:var(--sky)}
::selection{background:var(--neon);color:var(--ink)}
h1{font-family:"Archivo Black",system-ui,sans-serif;font-weight:400;letter-spacing:-.01em;line-height:1.1;margin:0;font-size:clamp(24px,3.4vw,34px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
*{border-radius:0!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.wrap{max-width:520px;margin:0 auto;padding:0 24px}
.top{border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:22px;padding:14px 24px;max-width:1080px;margin:0 auto}
.brand{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);line-height:1.05} .brand:hover{background:none}
.brand .w1{font-family:"Archivo Black",system-ui,sans-serif;font-size:16px} .brand .w2{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.lang{display:inline-flex;border:1px solid var(--line);margin-left:auto} .lang button{border:0;background:#fff;padding:4px 8px;font-size:12px;color:var(--ink-3)} .lang button[aria-pressed=true]{background:var(--ink);color:#fff}
/* default-credentials banner: loud on purpose, the board is wide open while it shows */
.warn{background:var(--red);color:#fff;padding:12px 24px;font-size:13px;font-weight:500}
.warn[hidden]{display:none}
.warn code{background:rgba(255,255,255,.2);padding:0 4px}
.card{background:var(--surface);padding:26px 24px;margin:48px 0}
.lead{color:var(--ink-2);margin:10px 0 24px}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
input{display:block;width:100%;background:#fff;border:1px solid var(--line);padding:10px 12px;margin:0 0 18px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cta{display:inline-block;background:var(--accent);color:#fff;border:1px solid var(--accent);padding:12px 22px;font-weight:500} .cta:hover{background:#2C3CB0}
.cta[disabled]{opacity:.55;cursor:progress}
.err{color:var(--red);margin:16px 0 0;font-weight:500}
.err:empty{display:none}
.foot{color:var(--ink-3);font-size:12px;margin:0}
</style>
</head>
<body>
<div class="warn" id="warn" role="alert" hidden></div>
<header class="top"><div class="in">
  <a class="brand" href="/"><span class="w1">Pflege-Stellen</span><span class="w2">Bayern</span></a>
  <div class="lang" role="group" aria-label="Sprache / Language"><button type="button" data-lang="de">DE</button><button type="button" data-lang="en">EN</button></div>
</div></header>
<main class="wrap">
  <section class="card">
    <p class="eyebrow" data-i18n="eyebrow">Betreiber-Zugang</p>
    <h1 data-i18n="title">Anmelden</h1>
    <p class="lead" data-i18n="lead">Ein gemeinsames Passwort für Betreiber.</p>
    <form id="f" novalidate>
      <label for="user" data-i18n="l_user">Benutzer</label>
      <input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label for="pass" data-i18n="l_pass">Passwort</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password" required>
      <button class="cta" type="submit" id="go" data-i18n="submit">Anmelden</button>
    </form>
    <p class="err" id="err" role="alert"></p>
  </section>
  <p class="foot"><a href="/" data-i18n="back">← Zur öffentlichen Ansicht</a></p>
</main>
<script>
const $=s=>document.querySelector(s);
const I18N={
 de:{eyebrow:"Betreiber-Zugang",title:"Anmelden",lead:"Ein gemeinsames Passwort für Betreiber. Es gibt keine zweite Anmelde-Tür.",
  l_user:"Benutzer",l_pass:"Passwort",submit:"Anmelden",sending:"sende …",back:"← Zur öffentlichen Ansicht",
  e_bad:"Benutzer oder Passwort stimmt nicht.",e_empty:"Bitte Benutzer und Passwort eingeben.",e_fail:"Anmeldung fehlgeschlagen",
  warn:"Achtung: Es gilt noch das ausgelieferte Standard-Passwort. Jede Person, die das Repository gelesen hat, kann sich als Betreiber anmelden. Ändern über PUT /api/auth/password."},
 en:{eyebrow:"Operator access",title:"Sign in",lead:"One shared operator passphrase. There is no second sign-in door.",
  l_user:"User",l_pass:"Password",submit:"Sign in",sending:"signing in …",back:"← Back to the public view",
  e_bad:"Wrong user or password.",e_empty:"Please enter a user and a password.",e_fail:"Sign-in failed",
  warn:"Warning: the shipped default credentials are still in place. Anyone who has read the repository can sign in as owner. Change them with PUT /api/auth/password."}};
let LANG=localStorage.getItem("lang")||(navigator.language||"de").slice(0,2); if(!I18N[LANG]) LANG="de";
const t=k=>(I18N[LANG]||I18N.de)[k]??I18N.de[k]??k;
function applyLang(){ document.documentElement.lang=LANG; document.querySelectorAll("[data-i18n]").forEach(n=>n.textContent=t(n.dataset.i18n)); document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG)); if(!$("#warn").hidden) $("#warn").textContent=t("warn"); }
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{LANG=b.dataset.lang;localStorage.setItem("lang",LANG);applyLang();}));
applyLang();

// Where to go after a successful sign-in. Only a same-origin path is accepted -- "//evil.example" and
// "https://evil.example" are valid values of ?next= and would turn this form into an open redirect.
// What is checked is the *resolved* value, the exact string handed to location.href, never the input:
// inspecting the input is what the two previous versions did and both were bypassable. The regex
// /^\/(?!\/)/ accepted "/\evil.example/" (one leading slash, and every browser reads the backslash as the
// second slash of a scheme-relative URL); the version after it re-checked the input for "\" and "/" and
// then trusted u.pathname, but WHATWG normalisation collapses "/..//evil.example/x" to the pathname
// "//evil.example/x" -- scheme-relative again, off-origin again ("/%2e%2e//" decodes into the same thing).
// So: resolve first, demand the same origin, and refuse a pathname that is itself scheme-relative or
// carries a backslash. Anything else falls back to /pro.
const RAW=new URLSearchParams(location.search).get("next")||"";
function samePath(raw){
  let u; try{ u=new URL(raw,location.origin); }catch(_){ return null; }   // "//[" and friends throw
  if(u.origin!==location.origin) return null;                            // absolute or scheme-relative input
  if(u.pathname.startsWith("//")||u.pathname.includes("\\")) return null; // "//host/x" as a *path* is off-origin once assigned
  return u.pathname+u.search+u.hash;                                     // re-serialised by the parser
}
const NEXT=samePath(RAW)||"/pro";

// The banner has to be up *before* anyone signs in, so it comes from GET /api/me (which reports
// default_credentials to anyone) rather than from the login response -- by the time that arrives this
// page is already navigating away. No catch: a broken /api/me belongs in the console, not swallowed.
fetch("/api/me",{headers:{accept:"application/json"}}).then(r=>r.json()).then(me=>{
  if(me && me.default_credentials){ const w=$("#warn"); w.textContent=t("warn"); w.hidden=false; }
});

$("#f").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=$("#err"), go=$("#go"), user=$("#user").value.trim(), pass=$("#pass").value;
  err.textContent="";
  if(!user||!pass){ err.textContent=t("e_empty"); return; }
  go.disabled=true; go.textContent=t("sending");
  try{
    const r=await fetch("/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({user,pass})});
    if(r.ok){ location.href=NEXT; return; }                     // cookie is set by the response itself
    err.textContent=r.status===401?t("e_bad"):t("e_fail")+" ("+r.status+")";   // 401 never says which half was wrong
  }catch(ex){
    err.textContent=t("e_fail")+" ("+ex.message+")";
  }
  go.disabled=false; go.textContent=t("submit");
});
</script>
</body>
</html>
