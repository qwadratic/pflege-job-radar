  if((m=p.match(/^\/api\/jobs\/(\d+)$/))){ const j=M.jobs.find(x=>x.posting_id===+m[1]); return j?wrap(j):Promise.reject(new Error("404")); }
  if(p==="/api/cities"){ const by={}; M.clinics.forEach(c=>{const o=by[c.town]||(by[c.town]={city:c.town,regierungsbezirk:c.regierungsbezirk,landkreis:c.landkreis,clinics:0,jobs_open:0,jobs_fresh:0}); o.clinics++; o.jobs_open+=c.jobs_open; o.jobs_fresh+=c.jobs_fresh;}); return wrap(Object.values(by)); }
  if(p==="/api/search"){ const q=(g.q||"").toLowerCase(); return wrap({clinics:M.clinics.filter(c=>(c.name+c.town).toLowerCase().includes(q)).slice(0,6),jobs:M.jobs.filter(j=>(j.title+j.city).toLowerCase().includes(q)).slice(0,6),cities:[...new Set(M.clinics.map(c=>c.town))].filter(c=>c.toLowerCase().includes(q)).map(c=>({city:c}))}); }
  if(p==="/api/billing"){ const w=g.window||"7d", now=new Date(), hourly=w==="today"; const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"), hh=d=>String(d.getHours()).padStart(2,"0");
    const n=hourly?now.getHours()+1:w==="7d"?7:w==="30d"?30:w==="period"?now.getDate():(g.from&&g.to?Math.max(1,Math.min(120,Math.round((new Date(g.to)-new Date(g.from))/864e5)+1)):7); let s2=w.length*7+n; const r2=()=>(s2=(s2*16807)%2147483647)/2147483647;
    const series=[]; for(let i=n-1;i>=0;i--){ const d=hourly?new Date(now.getFullYear(),now.getMonth(),now.getDate(),now.getHours()-i):new Date(now.getFullYear(),now.getMonth(),now.getDate()-i); const runs=Math.floor(r2()*3)+(r2()>.25?1:0), bill=runs&&r2()>.4?Math.floor(r2()*90):0, free=runs?Math.floor(r2()*40):0;

    const sum=k=>series.reduce((a,b)=>a+b[k],0); const runs=[]; series.slice(-8).forEach((b,i)=>{ for(let k=0;k<Math.min(b.runs,2);k++){ const free=k===1||!b.credits_billable; const c=M.clinics[(i*3+k)%M.clinics.length];
      runs.push({run_id:1000+i*3+k,at:b.t.slice(0,hourly?13:10)+(hourly?":"+String(10+k*7).padStart(2,"0")+":00":"T"+String(7+k*4).padStart(2,"0")+":12:00")+"+00:00",scope:free?"clinic":"district",value:free?c.clinic_id:c.regierungsbezirk,mode:k?"deep":"fast",status:k&&i%3===0?"failed":"done",credits:free?0:Math.round(b.credits_billable/2),free,rows:12+i*3,new:k?0:2+i,clinic_id:c.clinic_id,clinic:c.name,clinics:1,trigger:k?"manual":"schedule"}); } });
    const usdT=+sum("usd").toFixed(2), postings=runs.reduce((a,r)=>a+(r.new||0),0);
    return wrap({window:{key:w,from:series[0].t,to:series[series.length-1].t,granularity:hourly?"hour":"day"},price_per_credit:0.0053,currency:"USD",series,
      totals:{usd:usdT,credits:sum("credits_billable")+sum("credits_free"),credits_billable:sum("credits_billable"),credits_free:sum("credits_free"),tokens:sum("tokens"),runs:runs.length,runs_free:runs.filter(r=>r.free).length,runs_billable:runs.filter(r=>!r.free).length,runs_failed:runs.filter(r=>r.status==="failed").length,new_postings:postings,cost_per_posting_usd:postings?+(usdT/postings).toFixed(3):null,refills:hourly?0:1,exa_usd:3.42},
      by_kind:[{kind:"firecrawl_jobs",credits:sum("credits_billable")},{kind:"firecrawl_career",credits:sum("credits_free")}],runs:runs.reverse(),pools:{credits_remaining:4120,credits_plan:5000,tokens_remaining:61800,tokens_plan:75000,period_start:iso(new Date(now.getFullYear(),now.getMonth(),1)),period_end:iso(new Date(now.getFullYear(),now.getMonth()+1,0)),free_runs_left_today:3,agent_runs_today:2}}); }

  return Promise.reject(new Error("mock: "+p)); }
