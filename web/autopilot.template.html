<script>

const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,y]of Object.entries(a)){if(y==null||y===false)continue;x==="text"?e.textContent=y:x==="html"?e.innerHTML=y:x==="value"?e.value=y:x.startsWith("on")?e.addEventListener(x.slice(2),y):e.setAttribute(x,y);}k.flat(9).forEach(c=>c!=null&&c!==false&&e.append(c));return e;};

const BASE="/api/autopilot";
async function api(path,opt={}){
  const r=await fetch(BASE+path,opt); const ct=r.headers.get("content-type")||"";
  const b=ct.includes("json")?await r.json():await r.text();
  if(!r.ok) throw new Error((b&&b.error)||(b&&b.detail&&(typeof b.detail==="string"?b.detail:JSON.stringify(b.detail)))||("HTTP "+r.status));
  return b;
}

const NAV=[["/inbox","n_inbox"],["/funnel","n_funnel"],["/matching","n_matching"],["/clinics","n_clinics"],["/approvals","n_approvals"],["/queue","n_queue"],["/campaigns","n_campaigns"],["/templates","n_templates"],["/accounts","n_accounts"],["/policy","n_policy"]];
function parseHash(){ const h=location.hash.replace(/^#/,"")||"/inbox"; const [p,q]=h.split("?"); const params={}; new URLSearchParams(q||"").forEach((v,k)=>params[k]=v); return {path:p||"/inbox",params}; }
function nav(path,params){ location.hash=path+qs(params||{}); }
function setParams(params){ const {path}=parseHash(); history.replaceState(null,"","#"+path+qs(params)); }
function renderSidenav(){ const {path}=parseHash();
  $("#sidenav").replaceChildren(...NAV.map(([p,k])=>{
    const on=p==="/matching"?(path.startsWith("/matching")||path.startsWith("/cohorts")):p==="/clinics"?path.startsWith("/clinics"):path.startsWith(p);
    let bd=null; if(p==="/approvals"&&OVERVIEW?.counts?.approvals_pending) bd=el("span",{class:"bd",text:num(OVERVIEW.counts.approvals_pending)});
    if(p==="/queue"&&OVERVIEW?.counts?.queue_due) bd=el("span",{class:"bd",text:num(OVERVIEW.counts.queue_due)});
    return el("a",{href:"#"+p,class:on?"on":""},t(k),bd);
  }));
}
let ROUTE_TOKEN=0;
async function route(){
  const {path,params}=parseHash(); const token=++ROUTE_TOKEN; const v=$("#view"); renderSidenav(); renderTopbar();
  v.replaceChildren(loadingCard());
  try{
    let m; let page;
    if(path==="/"||path==="") { nav("/inbox"); return; }
    else if((m=path.match(/^\/inbox\/(\d+)$/))) page=await pageInbox(params, +m[1]);
    else if(path==="/inbox") page=await pageInbox(params, null);
    else if(path==="/funnel") page=await pageFunnel(params);
    else if(path==="/matching") page=await pageMatching(params);
    else if((m=path.match(/^\/cohorts\/(\d+)$/))) page=await pageCohortDetail(+m[1]);
    else if((m=path.match(/^\/clinics\/(\d+)$/))) page=await pageClinicDetail(+m[1]);
    else if(path==="/clinics") page=await pageClinics(params);
    else if(path==="/approvals") page=await pageApprovals(params);
    else if(path==="/queue") page=await pageQueue(params);
    else if(path==="/campaigns") page=await pageCampaigns();
    else if(path==="/templates") page=await pageTemplates(params);
    else if(path==="/accounts") page=await pageAccounts();
    else if(path==="/policy") page=await pagePolicy();
    else page=el("p",{class:"empty",text:"404"});
    if(token!==ROUTE_TOKEN) return;
    v.replaceChildren(...[].concat(page));
  }catch(e){ if(token!==ROUTE_TOKEN) return; v.replaceChildren(errorCard(e)); console.error(e); }
}
window.addEventListener("hashchange",route);

function useBar(used,cap){ const pctv=cap?Math.min(100,used/cap*100):0; return el("div",{class:"usebar"},el("i",{class:pctv>=95?"over":"",style:`width:${pctv}%`})); }
function qualityDot(q){ return el("span",{class:"dotst "+(q==="green"?"green":q==="yellow"?"yellow":q==="red"?"red":"")}); }
async function pageAccounts(){
  const root=el("div"); root.append(el("h1",{text:t("n_accounts")}));
  let data; try{ data=await api("/accounts"); }catch(e){ return errorCard(e); }
  function acctTable(title,rows){
    const head=el("thead",{},el("tr",{},el("th",{text:t("name")}),el("th",{text:t("status")}),el("th",{text:t("quality")}),el("th",{text:t("cap")}),el("th",{text:t("warmup")}),el("th",{text:t("last_error")}),el("th",{text:t("last_ok")})));
    const body=el("tbody",{},...rows.map(a=>{
      const nameCell=el("td",{},el("div",{class:"t",text:a.name}),el("div",{class:"m",text:a.identifier}));
      const qualityCell=el("td",{},qualityDot(a.quality),a.quality||"–");
      const capCell=el("td",{},useBar(a.used_today,a.daily_cap),el("div",{class:"m",text:`${num(a.used_today)} / ${num(a.daily_cap)}`}));
      return el("tr",{},nameCell,el("td",{text:a.status}),qualityCell,capCell,el("td",{text:a.warmup_stage||"–"}),el("td",{class:"m",text:a.last_error||"–"}),el("td",{text:ago(a.last_ok_at)}));
    }));
    const table=el("table",{},head,body);
    return el("div",{class:"tbl"},el("div",{class:"top"},el("h3",{text:title})),el("div",{class:"tw"},table));
  }
  root.append(acctTable(t("whatsapp"),data.whatsapp||[]));
  root.append(acctTable(t("mailboxes"),data.mailboxes||[]));
  root.append(acctTable(t("apis"),data.apis||[]));
  const routeHead=el("thead",{},el("tr",{},el("th",{text:t("name")}),el("th",{text:t("f_campaign")}),el("th",{text:t("f_lang")})));
  const routeBody=el("tbody",{},...(data.routing||[]).map(r=>el("tr",{},el("td",{text:r.name}),el("td",{text:(r.campaigns||[]).join(", ")}),el("td",{text:(r.languages||[]).join(", ")}))));
  root.append(el("div",{class:"tbl"},el("div",{class:"top"},el("h3",{text:t("routing")})),el("div",{class:"tw"},el("table",{},routeHead,routeBody))));
  return root;
}

    el("div",{style:"margin-top:10px"},el("span",{class:"lbl",style:"display:block"},t("risk_rules")),
      el("div",{class:"row"},t("risk_low"),riskLow,t("risk_medium"),riskMed,t("risk_high"),riskHigh)),
    el("div",{style:"margin-top:10px"},el("span",{class:"lbl",style:"display:block"},t("escalation")),escList),
    el("div",{style:"margin-top:10px"},el("span",{class:"lbl",style:"display:block"},t("auto_pause")),pauseList),
    el("div",{style:"margin-top:12px"},el("button",{class:"btn n",type:"button",onclick:async()=>{
      const body={mode:modeSel.value,quiet_hours:[+qhStart.value,+qhEnd.value],max_msgs_per_candidate_per_day:+maxDay.value,
        cadence_candidate_hours:cadCand.value.split(",").map(x=>+x.trim()).filter(Boolean),

        risk_rules:{low:riskLow.value,medium:riskMed.value,high:riskHigh.value},
        escalation_triggers:escList.value.split(",").map(x=>x.trim()).filter(Boolean),

      try{ await put("/policy",body); toast(t("policy_saved")); loadOverview(); }catch(e){ toast(t("err_generic",{m:e.message})); }
    }},t("policy_save")))));
  return root;
}

// ---- keyboard shortcuts ---------------------------------------------------------------------------
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if($("#dlg").open) $("#dlg").close(); return; }
  const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select") return;
  if(e.key==="/"){ const s=$("#ib-search"); if(s){ e.preventDefault(); s.focus(); } }
  if((e.key==="j"||e.key==="k") && parseHash().path.startsWith("/inbox")){
    const items=[...document.querySelectorAll(".lrow")]; if(!items.length) return;
    let i=items.findIndex(x=>x.classList.contains("on")); i=i<0?0:Math.max(0,Math.min(items.length-1,i+(e.key==="j"?1:-1)));
    items[i].click(); items[i].scrollIntoView({block:"nearest"});
  }
});

// ---- boot -----------------------------------------------------------------------------------------
applyLang();
(async()=>{ await loadOverview(); route(); })();
