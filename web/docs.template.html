<script>
// Build the table of contents from the rendered headings, and highlight the section in view.
const heads=[...document.querySelectorAll("#doc h2")];
const toc=document.getElementById("toc");
heads.forEach((h,i)=>{ if(!h.id) h.id="s"+i;
  const a=document.createElement("a"); a.href="#"+h.id; a.textContent=h.textContent.replace(/^\d+\.\s*/,""); toc.append(a); });
const links=[...toc.querySelectorAll("a")];
const io=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting){
  const i=heads.indexOf(e.target); links.forEach((l,j)=>l.classList.toggle("on",j===i)); }});},
  {rootMargin:"-70px 0px -75% 0px"});
heads.forEach(h=>io.observe(h));
</script>
