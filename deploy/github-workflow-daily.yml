# Reference only: GitHub Actions daily refresh. Not committed under .github/ because the push token lacks the
# `workflows` scope; the VM app (app/scheduler.py) now runs the weekly staggered autocrawl instead.
name: pflege-jobs daily refresh
on:
  schedule: [{cron: "17 4 * * *"}]     # 04:17 UTC daily
  workflow_dispatch:
    inputs: {stages: {description: "stages (comma) or all", default: "all"}}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PFLEGE_INGEST_URL: ${{ secrets.PFLEGE_INGEST_URL }}
      PFLEGE_INGEST_SECRET: ${{ secrets.PFLEGE_INGEST_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests
      - run: python -m pflege_jobs.orchestrate --stages ${{ github.event.inputs.stages || 'all' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: crawl-checkpoints, path: "data/*_done.json", retention-days: 7}
