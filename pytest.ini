[pytest]
markers =
    network: talks to a live system on purpose (the registry drift guard, a live STT call, one real careers page); tests/conftest.py's network guard fails it unless MIRROR_RECORD=1 lifts the guard, so CI deselects it with -m "not network"
    completeness: adapter-vs-board completeness contract (tests/adapter_contract.py), replayed from the local mirror (tests/mirror.py)
    mutation: breaks an adapter on purpose to prove the completeness test notices
    mirror: needs real boards from the local mirror (data/mirror, `tools/mirror.py pull`); everything else runs without it (the infra snapshots are in tests/fixtures/mirror_infra). CI: `-m "not mirror and not network and not llm"` without a pull, `-m mirror` after one
    llm: spawns the real `claude` CLI (WA_BRAIN=luna persona tests; app.cv.analyse_llm eval tests)
        -- costs real money and takes several seconds per call; deselect with -m "not llm"
