[pytest]
markers =
    completeness: adapter-vs-board completeness contract (tests/adapter_contract.py), replayed from the local mirror (tests/mirror.py)
    mutation: breaks an adapter on purpose to prove the completeness test notices
    mirror: needs real boards from the local mirror (data/mirror, `tools/mirror.py pull`); everything else runs without it (the infra snapshots are in tests/fixtures/mirror_infra). CI: `-m "not mirror and not llm"` without a pull, `-m mirror` after one
