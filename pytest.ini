[pytest]
markers =
    network: talks to live boards or the read proxy; deselect with -m "not network"
    completeness: adapter-vs-board completeness contract (tests/adapter_contract.py)
    mutation: breaks an adapter on purpose to prove the completeness test notices
    llm: spawns the real `claude` CLI (WA_BRAIN=luna, tests/test_wa_luna_personas.py) -- costs
        real money and takes several seconds per turn; deselect with -m "not llm"
